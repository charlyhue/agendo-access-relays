[package]
name = "relay-fuzz"
description = "Cibles cargo-fuzz des décodeurs exposés au réseau"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[package.metadata]
cargo-fuzz = true

# Workspace à part : compilé en nightly par cargo-fuzz.
[workspace]

[dependencies]
agendo-access-protocol = { git = "ssh://git@github.com/charlyhue/agendo.git", tag = "v0.42.0" }
libfuzzer-sys = "0.4"
relay-common = { path = "../crates/relay-common" }
relay-sni = { path = "../crates/relay-sni", features = ["testkit"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "time", "macros", "test-util"] }
tokio-util = "0.7"

[[bin]]
name = "client_hello"
path = "fuzz_targets/client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_protocol"
path = "fuzz_targets/proxy_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "push_request"
path = "fuzz_targets/push_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tunnel_session"
path = "fuzz_targets/tunnel_session.rs"
test = false
doc = false
bench = false
