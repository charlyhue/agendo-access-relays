[package]
name = "relay-sni"
description = "Relais SNI d'Agendo Access : passe les connexions TLS aux maisons, sans les déchiffrer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "relay-sni"
path = "src/main.rs"

[features]
# Outillage de test (clés fixes, fausse maison), pour les tests d'intégration.
testkit = ["dep:rcgen", "dep:rustls", "dep:tokio-rustls"]

[dependencies]
agendo-access-protocol.workspace = true
bytes.workspace = true
relay-common.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
# Seulement pour la feature `testkit`.
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
relay-sni = { path = ".", features = ["testkit"] }

[lints]
workspace = true
